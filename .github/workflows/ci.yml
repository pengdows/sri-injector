name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engines floor, then each supported LTS line (22 and 24 in maintenance, 26 active).
        node: ['22.13.0', '22', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm coverage
      # Real Chromium (preinstalled on ubuntu-latest). CI=true makes a missing browser fail, not skip.
      - run: pnpm test:browser
